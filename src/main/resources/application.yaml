ktor:
  application:
    modules:
      - n.learn.ApplicationKt.module
  deployment:
    port: 8080

database:
  url: ${DB_URL:-jdbc:postgresql://localhost:5432/mdeditor}
  user: ${DB_USER:-postgres}
  password: ${DB_PASSWORD:-postgres}

jwt:
  secret: ${JWT_SECRET:-change_this_secret_in_production}
  issuer: "mdeditor"
  audience: "mdeditor-users"
  expiration: 86400000

uploads:
  dir: ${UPLOADS_DIR:-uploads}
